<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — NexCore</title>
<link rel="stylesheet" href="../shared/styles.css">
<style>
  body{ overflow:hidden; }
  canvas#wave{ position: fixed; inset:0; width:100%; height:100%; display:block; }
  .vignette{
    position: fixed; inset:0; pointer-events:none;
    background:
      radial-gradient(ellipse 55% 45% at 50% 62%, rgba(10,9,8,0) 0%, rgba(10,9,8,0.2) 65%, rgba(10,9,8,0.7) 100%),
      linear-gradient(to bottom, rgba(10,9,8,0.2) 0%, rgba(10,9,8,0) 25%, rgba(10,9,8,0) 75%, rgba(10,9,8,0.4) 100%);
  }
  .auth-wrap{
    position: relative; z-index:2; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding: 32px 20px;
  }
  .auth-mark{ position:absolute; top:36px; left:50%; transform:translateX(-50%); }
  .card{
    width:100%; max-width:380px;
    background: linear-gradient(180deg, rgba(19,17,16,0.86), rgba(12,11,10,0.92));
    border: 1px solid var(--line); border-radius:4px;
    padding: 36px 34px 30px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 0 0 1px rgba(255,90,54,0.04), 0 30px 80px -20px rgba(0,0,0,0.75), 0 0 120px -40px var(--ember-3);
  }
  .tabs{ display:flex; gap:2px; margin-bottom:26px; background: rgba(255,255,255,0.03); border-radius:4px; padding:3px; }
  .tabs button{
    flex:1; padding:9px; background:none; border:none; border-radius:3px;
    color: var(--paper-dim); font-size:13.5px; font-weight:600; cursor:pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .tabs button.active{ background: rgba(255,90,54,0.12); color: var(--paper); }
  .card h1{ margin:0 0 6px; font-family: var(--font-display); font-weight:500; font-size:22px; }
  .card p.sub{ margin:0 0 26px; font-size:13.5px; color: var(--paper-dim); line-height:1.5; }
  .submit{ width:100%; margin-top:4px; padding:13px; }
  .form-error{
    display:none; margin-bottom:16px; padding:10px 12px; border-radius:4px;
    background: rgba(255,90,76,0.1); border:1px solid rgba(255,90,76,0.35);
    color: #ffb3a8; font-size:13px; line-height:1.4;
  }
  .form-error.show{ display:block; }
  .panel{ display:none; }
  .panel.active{ display:block; }
  .footer-links{
    position:relative; z-index:2; text-align:center; padding-bottom: 18px;
    font-size:12px; color: var(--muted);
  }
  .footer-links a{ color: var(--muted); text-decoration:none; border-bottom:1px solid transparent; }
  .footer-links a:hover{ color: var(--ember-1); border-color: rgba(255,90,76,0.3); }
  @media (max-width:420px){ .card{ padding:30px 22px 26px; } .auth-mark{ top:22px; } }
</style>
</head>
<body>

<canvas id="wave"></canvas>
<div class="vignette"></div>

<div class="auth-wrap">
  <div class="mark auth-mark">nexcore</div>

  <div class="card">
    <div class="tabs">
      <button type="button" class="active" id="tabLogin">Sign in</button>
      <button type="button" id="tabSignup">Create account</button>
    </div>

    <div class="panel active" id="panelLogin">
      <h1>Welcome back</h1>
      <p class="sub">Sign in to get to your files.</p>
      <div class="form-error" id="loginError"></div>
      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="loginEmail">Email</label>
          <div class="field-input"><input id="loginEmail" type="email" placeholder="you@domain.com" required></div>
        </div>
        <div class="field">
          <label for="loginPw">Password</label>
          <div class="field-input">
            <input id="loginPw" type="password" placeholder="••••••••••" required>
            <button type="button" class="toggle-vis" data-target="loginPw">Show</button>
          </div>
        </div>
        <button class="btn btn-primary submit" type="submit">Sign in</button>
      </form>
    </div>

    <div class="panel" id="panelSignup">
      <h1>Create your account</h1>
      <p class="sub">Free 2&nbsp;GB of storage on this server to start.</p>
      <div class="form-error" id="signupError"></div>
      <form id="signupForm" autocomplete="off">
        <div class="field">
          <label for="signupEmail">Email</label>
          <div class="field-input"><input id="signupEmail" type="email" placeholder="you@domain.com" required></div>
        </div>
        <div class="field">
          <label for="signupPw">Password</label>
          <div class="field-input">
            <input id="signupPw" type="password" placeholder="At least 8 characters" required>
            <button type="button" class="toggle-vis" data-target="signupPw">Show</button>
          </div>
          <div class="field-hint">Your password is hashed on this server — see the cookie policy.</div>
        </div>
        <button class="btn btn-primary submit" type="submit">Create account</button>
      </form>
    </div>
  </div>
</div>

<div class="footer-links">
  <a href="/legal/cookie-policy.html">Cookie policy</a>
</div>

<script src="../shared/wave-bg.js"></script>
<script src="../shared/api-client.js"></script>
<script src="../shared/consent.js"></script>
<script>
  initWaveBackground('wave');

  // Already signed in? skip straight to the dashboard.
  Api.me().then(({ email }) => {
    if(email) window.location.href = '/dashboard/';
  }).catch(() => {});

  const tabLogin = document.getElementById('tabLogin');
  const tabSignup = document.getElementById('tabSignup');
  const panelLogin = document.getElementById('panelLogin');
  const panelSignup = document.getElementById('panelSignup');

  function showTab(which){
    const isLogin = which === 'login';
    tabLogin.classList.toggle('active', isLogin);
    tabSignup.classList.toggle('active', !isLogin);
    panelLogin.classList.toggle('active', isLogin);
    panelSignup.classList.toggle('active', !isLogin);
  }
  tabLogin.addEventListener('click', () => showTab('login'));
  tabSignup.addEventListener('click', () => showTab('signup'));

  document.querySelectorAll('.toggle-vis').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const isPw = input.type === 'password';
      input.type = isPw ? 'text' : 'password';
      btn.textContent = isPw ? 'Hide' : 'Show';
    });
  });

  function showError(el, message){ el.textContent = message; el.classList.add('show'); }
  function clearError(el){ el.classList.remove('show'); }

  const loginError = document.getElementById('loginError');
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError(loginError);
    const email = document.getElementById('loginEmail').value;
    const pw = document.getElementById('loginPw').value;
    try{
      await Api.login(email, pw);
      window.location.href = '/dashboard/';
    }catch(err){
      showError(loginError, err.message);
    }
  });

  const signupError = document.getElementById('signupError');
  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError(signupError);
    const email = document.getElementById('signupEmail').value;
    const pw = document.getElementById('signupPw').value;
    try{
      await Api.signup(email, pw);
      window.location.href = '/dashboard/';
    }catch(err){
      showError(signupError, err.message);
    }
  });
</script>
</body>
</html>
